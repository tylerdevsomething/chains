[package]
name = "chains"
version = "0.1.0"
edition = "2021"
rust-version = "1.79"

[lib]
crate-type = ["cdylib", "lib"]
name = "chains"

[features]
default = []
# Test builds only: MAX_CHAINS = 6 and MIN_EXPIRY = 5 seconds so the rehearsal can hit SoldOut
# and an end date. Mainnet builds omit it.
localnet = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build"]

[dependencies]
anchor-lang = { version = "=0.31.1", features = ["init-if-needed", "event-cpi"] }
mpl-core = "0.10"
